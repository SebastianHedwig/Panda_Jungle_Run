<!DOCTYPE html>
<html lang="de" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/img/Character/Spriter_files/image-01.png" type="image/x-icon">
    <title>Panda Jungle Run</title>

    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div id="game-container">
        <canvas id="game" class="canvas"></canvas>

        <div class="hud-container hud-container-left">
            <button id="settings-toggle" class="hud-button settings-toggle" type="button" aria-label="Settings">
                <img src="./assets/icons/controler.png" alt="Settings">
                <span class="hud-label">settings</span>
            </button>
            <button id="sound-toggle" class="hud-button sound-toggle" type="button" aria-pressed="false" aria-label="Sound ausschalten">
                <img id="sound-icon" src="./assets/icons/sound-on-100.png" alt="Sound an">
                <span id="sound-label" class="hud-label">sound: off</span>
            </button>
        </div>

        <div class="hud-container hud-container-right">
            <button id="fullscreen-toggle" class="hud-button fullscreen-toggle" type="button" aria-pressed="false" aria-label="Fullscreen">
                <img id="fullscreen-icon" src="./assets/icons/fullscreen-on.png" alt="Fullscreen">
                <span id="fullscreen-label" class="hud-label">fullscreen</span>
            </button>
        </div>
        
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
