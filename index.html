<!DOCTYPE html>
<html lang="de" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/img/Character/Spriter_files/image-01.png" type="image/x-icon">
    <title>Panda Jungle Run</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/hud.css">
    <link rel="stylesheet" href="./styles/mobileRotationOverlay.css">
    <script type="module" src="./src/main.js" defer></script>
    
</head>
<body>
    <div id="game-container">
        <canvas id="game" class="canvas"></canvas>

        <div class="mobile-control-container mobile-control-container-left">
            <button class="mobile-control-button" type="button">
                <img src="./assets/icons/mobileControls/arrow-backward.png" alt="Nach links">
            </button>
            <button
                class="mobile-control-button mobile-control-button--fast-forward mobile-control-button--no-scale"
                type="button"
                data-src-inactive="./assets/icons/mobileControls/button-fast-forward-inactive.png"
                data-src-active="./assets/icons/mobileControls/button-fast-forward.active.png"
            >
                <img id="mobile-fast-forward-icon" src="./assets/icons/mobileControls/button-fast-forward-inactive.png" alt="Sprinten">
            </button>
            <button class="mobile-control-button" type="button">
                <img src="./assets/icons/mobileControls/arrow-forward.png" alt="Nach rechts">
            </button>
        </div>

        <div class="mobile-control-container mobile-control-container-right">
            <button class="mobile-control-button" type="button">
                <img src="./assets/icons/mobileControls/button-attack.png" alt="Angriff">
            </button>
            <button class="mobile-control-button" type="button">
                <img src="./assets/icons/mobileControls/button-jump.png" alt="Springen">
            </button>
            <button class="mobile-control-button" type="button">
                <img src="./assets/icons/mobileControls/button-slide.png" alt="Rutschen">
            </button>
        </div>

        <div class="hud-container hud-container-left">
            <button id="settings-toggle" class="hud-button settings-toggle" type="button">
                <img src="./assets/icons/controler.png" alt="Settings">
                <span class="hud-label">settings</span>
            </button>
            <button id="sound-toggle" class="hud-button sound-toggle" type="button">
                <img id="sound-icon" src="./assets/icons/sound-on-100.png" alt="Sound an/aus">
                <span id="sound-label" class="hud-label">sound: off</span>
            </button>
        </div>

        <div class="hud-container hud-container-right">
            <button id="fullscreen-toggle" class="hud-button fullscreen-toggle" type="button">
                <img id="fullscreen-icon" src="./assets/icons/fullscreen-on.png" alt="Fullscreen">
                <span id="fullscreen-label" class="hud-label">fullscreen</span>
            </button>
        </div>

        <div class="legal-links">
            <span class="impressum">Legal Notice</span>
            <span class="separator"></span>
            <span class="privacyPolicy">Privacy Policy</span>
        </div>
    </div>
</body>
</html>
